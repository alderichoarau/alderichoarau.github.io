# -----------------------------------------------------------------------------------------------
# CI only (no CD) -- mirrors the checks from .github/workflows/ci.yml and a11y.yml. Real deployment
# stays on GitHub Pages, driven only from the GitHub side and untouched by anything here.
# SAST/Secret Detection are GitLab's free-tier native templates (results as pipeline artifacts
# only, no Vulnerability Report/MR integration -- that needs Ultimate). Dependency Scanning and
# DAST have no free-tier equivalent, so they're not replicated here.
#
# The "pages" job publishes a GitLab Pages mirror of the site (a bonus backup copy, not the real
# deployment). This project isn't named <username>.gitlab.io, so it's served at a sub-path
# (https://alderichoarau.gitlab.io/alderichoarau.github.io/) instead of the domain root -- hence
# the explicit --base-href, separate from the GitHub Pages build which serves from the root and is
# never touched by this job.
# -----------------------------------------------------------------------------------------------
stages:
  - test
  - build
  - accessibility
  - pages

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

image: node:26

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

lint-test-build:
  stage: build
  script:
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run test
    - npm run build:prod

accessibility:
  stage: accessibility
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends chromium chromium-driver
  script:
    - npm ci
    - npm run build:prod
    - npx http-server docs/browser -p 4200 --silent &
    - |
      for i in $(seq 1 30); do
        curl -sf http://localhost:4200 > /dev/null && break
        sleep 1
      done
    - npx --yes @axe-core/cli@4.13.0 http://localhost:4200
      --chrome-path /usr/bin/chromium --chromedriver-path /usr/bin/chromedriver
      --chrome-options="no-sandbox,disable-dev-shm-usage,disable-gpu" --exit

pages:
  stage: pages
  script:
    - npm ci
    - npx ng build --configuration production --base-href /alderichoarau.github.io/
    - rm -rf public
    - mv docs/browser public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
