# -----------------------------------------------------------------------------------------------
# DAST: attacks the *running* app, unlike every other scan here. Targets the real deployed site
# (https://alderichoarau.github.io/) -- more meaningful than azure-quiz-*'s local-only DAST, since
# this one's actually live.
#
# Three triggers: manual, right after each successful deploy (workflow_run, guarded on
# `conclusion == 'success'`), and weekly (schedule) to catch new ZAP rules on unchanged content.
# cron is UTC only, no DST -- 07:00 UTC is 08:00 Paris in winter, 09:00 in summer.
#
# Baseline (passive) scan: static site, nothing an active scan would add.
#
# EXPECT permanent header WARNs, not a real gap: GitHub Pages serves fixed headers with no way to
# override them. CSP is already set via a <meta> tag in index.html (see its comment for why
# frame-ancestors can't be covered that way); X-Frame-Options has no meta equivalent at all --
# both stay unaddressable here short of a CDN in front (Cloudflare, etc.).
# -----------------------------------------------------------------------------------------------
name: "GitHub - Security (DAST): OWASP ZAP Baseline Scan"
run-name: Security (DAST) - OWASP ZAP Baseline Scan

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Angular App to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC (08:00 Paris in winter, 09:00 in summer)

permissions:
  contents: read

jobs:
  zap-baseline:
    name: "OWASP ZAP baseline scan"
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: "Run ZAP baseline scan"
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://alderichoarau.github.io/"
          fail_action: false
          allow_issue_writing: false
          # No cmd_options: this action already writes report_html.html/report_md.md/
          # report_json.json by default. Renaming them via -r/-w/-J broke the artifact-upload
          # step -- hit live ("report_md.md does not exist") in azure-quiz-frontend's dast.yml.

      - name: "Publish alert summary to job summary"
        if: always()
        run: |
          if [ ! -f report_md.md ]; then
            echo "⚠️ report_md.md not found -- ZAP markdown report wasn't generated (check the 'Run ZAP baseline scan' step above)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## 🔍 OWASP ZAP Baseline — Summary of Alerts"
            echo
            # Slice out the "Summary of Alerts" section -- everything up to the next level-2
            # heading (e.g. "## Alert Detail").
            SUMMARY=$(awk '
              /^## Summary of Alerts/ { found=1 }
              found && /^## / && !/^## Summary of Alerts/ { exit }
              found { print }
            ' report_md.md)

            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY"
            else
              echo "_Could not locate a \"Summary of Alerts\" section in the report -- see the full report below._"
            fi

            echo
            echo "<details><summary>Full ZAP report (Markdown)</summary>"
            echo
            cat report_md.md
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
