# -----------------------------------------------------------------------------------------------
# Secrets scanning: catches API keys/tokens committed by mistake, in the diff and past history.
# Extracted from ci.yml's "security" job. gitleaks alone -- Trivy's secret scanner was redundant.
# -----------------------------------------------------------------------------------------------
name: "GitHub - Security (Secrets): Gitleaks Scan"
run-name: Security (Secrets) - Run Gitleaks Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: "Scan for leaked secrets"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so gitleaks can scan past commits too

      - name: "Scan for leaked secrets (gitleaks)"
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
