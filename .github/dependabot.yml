version: 2

updates:
  # Angular & npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    
    # Grouped by bump type (not by package category) -- consistent with azure-quiz-backend/
    # azure-quiz-frontend's dependabot.yml, and lets patch-only PRs be auto-merged (see
    # dependabot-auto-merge.yml) while minor/major still get a human look.
    groups:
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"
      major-updates:
        update-types:
          - "major"
    
    # Configuration options
    open-pull-requests-limit: 10
    pull-request-branch-name:
      separator: "/"
    
    # Commit message customization
    commit-message:
      prefix: "deps"
      include: "scope"
    
    # PR settings
    reviewers:
      - "alderichoarau"  # Replace with your GitHub username if different
    
    # Labels for easier management
    labels:
      - "dependencies"
      - "automated"
    
    # Allow both dev and prod dependencies
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    
    # Ignore specific packages if needed
    ignore:
      # Ignore Node.js version (handled separately)
      - dependency-name: "node"
      # Ignore major Angular updates that need manual review
      # - dependency-name: "@angular/*"
      #   update-types: ["version-update:semver-major"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Paris"
    
    # Group all GitHub Actions updates
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    
    labels:
      - "github-actions"
      - "ci/cd"
      - "dependencies"